spring.datasource.url=jdbc:postgresql://localhost:5432/cd_notification
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

server.error.include-message=always
spring.test.database.replace=none
spring.jpa.hibernate.ddl-auto=create-drop

spring.main.banner-mode=off
# Set the root logging level to WARN
logging.level.root=WARN

# Set specific logging levels for packages
logging.level.org.springframework=ERROR
logging.level.ru.checkdev=ERROR
logging.level.org.hibernate=ERROR
logging.level.liquibase=ERROR

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false